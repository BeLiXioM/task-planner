<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик задач</title>
  <script type="module" src="./script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="planner">
    <h1>Планировщик задач</h1>
    <form id="task-form">
        <label for="task-title">Новая задача</label>
<input id="task-title" type="text" aria-describedby="task-error">
        <label for="task-date">Срок выполнения</label>
        <input id="task-date" type="date">
        <p id="task-error" aria-live="polite"></p>
        <div class="form-actions">
        <button id="cancel-edit" type="button" hidden>Отмена</button>
        <button id="task-button" type="submit">Добавить</button>
        </div>
    </form>
    <label for="task-filter">Показать задачи</label>
    <select id="task-filter">
        <option value="all">Все</option>
        <option value="active">Активные</option>
        <option value="completed">Выполненные</option>
    </select>
    <p id="task-count">Осталось задач: 0</p>
    <ul id="task-list">
        
    </ul>
</main>

</body>
</html>
